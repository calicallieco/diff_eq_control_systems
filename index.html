<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Can feedback stabilize an unstable equilibrium?</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="title">
      <h1>Can feedback stabilize an unstable equilibrium?</h1>
      <p class="sub">First-/second-order systems · eigenvalues · parameter tests</p>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Simulation controls">
      <div class="group">
        <span class="group-label">System</span>
        <div class="seg">
          <button id="mode-1" aria-pressed="true">1st order</button>
          <button id="mode-2" aria-pressed="false">2nd order</button>
        </div>
      </div>
      <div class="group">
        <span class="group-label">Equation</span>
        <div class="seg">
          <button id="eq-hom" aria-pressed="true" title="Homogeneous: d = 0"><span class="full">Homogeneous</span><span class="short">d = 0</span></button>
          <button id="eq-non" aria-pressed="false" title="Non-homogeneous: constant disturbance d"><span class="full">Non-homogeneous</span><span class="short">d ≠ 0</span></button>
        </div>
      </div>
      <div class="group">
        <span class="group-label">Feedback</span>
        <button id="fb-toggle" class="btn big" aria-pressed="true" title="F">ON</button>
      </div>
      <div class="group">
        <span class="group-label">Run</span>
        <div class="btnrow">
          <button id="btn-nudge-l" class="btn" title="Nudge left (←)"><span aria-hidden="true">◀</span><span class="lbl"> Nudge</span></button>
          <button id="btn-nudge-r" class="btn" title="Nudge right (→)"><span class="lbl">Nudge </span><span aria-hidden="true">▶</span></button>
          <button id="btn-pause" class="btn" title="Space"><span aria-hidden="true">⏸</span><span class="lbl"> Pause</span></button>
          <button id="btn-reset" class="btn" title="R"><span aria-hidden="true">↺</span><span class="lbl"> Reset</span></button>
          <select id="speed" aria-label="Speed">
            <option value="0.25">¼×</option>
            <option value="0.5">½×</option>
            <option value="1" selected>1×</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">

    <section class="left">
      <div class="card stage-card">
        <div class="card-head">
          <h2 id="robot-title">Cart on a rail</h2>
          <div id="status-chip" class="chip" role="status" aria-live="polite"></div>
        </div>
        <div class="stage">
          <canvas id="robot-canvas" tabindex="0"
                  aria-label="Simulation canvas. Drag the robot to set an initial condition."></canvas>
        </div>
        <div id="readout" class="readout"></div>
      </div>

      <div class="card dock">
        <div class="dock-top">
          <select id="presets" aria-label="Presets"></select>
          <label id="hold-wrap" class="check" hidden title="Also feed back the wheel position and speed (4th-order system)">
            <input type="checkbox" id="chk-hold"> Hold position
          </label>
          <button id="btn-adv" class="btn small">⚙ Advanced</button>
        </div>
        <div id="dock-sliders" class="sliders"></div>
      </div>
    </section>

    <section class="right">
      <div class="card summary">
        <div class="sum-row">
          <div class="sum-ode">
            <div class="sum-label">Closed-loop ODE</div>
            <div id="sum-ode" class="eq-body"></div>
          </div>
          <div id="sum-verdict" class="sum-verdict"></div>
        </div>
        <span id="approx-badge" class="badge-warn" hidden></span>
      </div>

      <div class="card inspector" id="inspector">
        <div class="tabbar">
          <div id="plot-tabs" class="tabs" role="tablist"></div>
          <button id="btn-enlarge" class="btn small" title="Enlarge for projector (Esc to close)">⤢ Enlarge</button>
        </div>

        <div id="panel-resp" class="panel">
          <canvas id="time-canvas" aria-label="Time response"></canvas>
        </div>

        <div id="panel-eq" class="panel col-panel" hidden>
          <div class="eq-stage" id="eq-stage">
            <div class="eq-inner">
              <div id="eq-label" class="eq-label"></div>
              <div id="eq-body" class="eq-body"></div>
            </div>
          </div>
          <div class="eq-nav">
            <button id="eq-prev" class="btn small" aria-label="Previous equation">◀</button>
            <div id="eq-dots" class="eq-dots"></div>
            <span id="eq-count" class="eq-count"></span>
            <button id="eq-next" class="btn small" aria-label="Next equation">▶</button>
          </div>
          <div class="subcard">
            <h3>Control law in action</h3>
            <div id="bars"></div>
          </div>
        </div>

        <div id="panel-tests" class="panel scroll-hide" hidden>
          <h3>Parameter tests</h3>
          <div id="tests"></div>
          <h3 class="spaced">What to notice</h3>
          <div id="notice"></div>
        </div>

        <div id="panel-plot" class="panel" hidden>
          <canvas id="plot-canvas" aria-label="Analysis plot"></canvas>
        </div>

        <p id="tab-hint" class="tab-hint"></p>
      </div>
    </section>
  </main>
</div>

<div id="backdrop" class="backdrop"></div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-label="Advanced settings">
  <div class="drawer-head">
    <h2>Advanced</h2>
    <button id="btn-adv-close" class="btn small" aria-label="Close advanced settings">✕ Close</button>
  </div>
  <div id="adv-controls"></div>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/katex/katex.min.js"></script>
<script src="js/model.js"></script>
<script src="js/sim.js"></script>
<script src="js/plots.js"></script>
<script src="js/robot.js"></script>
<script src="js/math-panel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
